global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: platform-api
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: platform-api

  - job_name: platform-worker
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: platform-worker

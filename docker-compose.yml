# Database metadata platform	platform_db
# Database target inventory_db
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: platform_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/000001_create_platform_schema.sql:/docker-entrypoint-initdb.d/02-platform-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U admin -d platform_db"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      APP_ADDR: ":8080"
      PLATFORM_DATABASE_URL: "postgres://admin:root@postgres:5432/platform_db?sslmode=disable"
      DB_CREDENTIAL_ENCRYPTION_KEY: "${DB_CREDENTIAL_ENCRYPTION_KEY:?Set DB_CREDENTIAL_ENCRYPTION_KEY in .env}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:28080}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      SESSION_IDLE_TIMEOUT: "${SESSION_IDLE_TIMEOUT:-30m}"
      SESSION_ABSOLUTE_TIMEOUT: "${SESSION_ABSOLUTE_TIMEOUT:-24h}"
      SESSION_ROTATION_INTERVAL: "${SESSION_ROTATION_INTERVAL:-15m}"
      SESSION_GRACE_PERIOD: "${SESSION_GRACE_PERIOD:-30s}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
    # register host port here (currently :28080)
      - "28080:8080"

  # frontend: 

volumes:
  postgres_data:

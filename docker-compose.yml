# Database metadata platform	platform_db
# Database target inventory_db
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: platform_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    environment:
      APP_ADDR: ":8080"
    ports:
    # register host port here (currently :28080)
      - "28080:8080"

  # frontend: 

volumes:
  postgres_data:
